<!-- ═══ SIKKERHEDSPOLITIK (CSP) — lagt på 18/9 ════════════════════════════
     Appen havde ingen. Det betød, at et indsprøjtet script kunne sende
     sessionstokenet fra localStorage hvorhen det ville. Den her politik
     fanger ikke selve indsprøjtningen (se 'unsafe-inline' nedenfor), men
     den lukker UDGANGEN: connect-src tillader kun vores egen Supabase og
     adresseregistret, så der ikke er nogen at sende det til.

     LINJE FOR LINJE, så ingen kommer til at løsne noget ved et uheld:

     · default-src 'none' — alt er forbudt, indtil det står nedenfor.
       Kommer der en ny slags ressource (en lyd, en iframe, et manifest),
       bliver den blokeret, og det ER meningen: så skal nogen tage stilling.

     · script-src 'unsafe-inline' — nødvendig I DAG, fordi app.js tegner
       med onclick="..." i skabelonerne. Det er den halvdel, der mangler,
       og den kan kun lukkes ved at lave alle onclick om til
       event-listeners. Stort arbejde i en fil på 466 KB, og det hører
       ikke hjemme under DAWA-fristen. Er det gjort, så fjern ordet her.

     · style-src 'unsafe-inline' — style="..." står i skabelonerne samme
       sted. Væsentligt mindre farlig end script.

     · img-src — vores egne filer, data: (to ikoner i app.css), Supabase
       (stedbilleder) og kortfliserne. {s} i tileLayer bliver til a/b/c,
       derfor jokertegnet.

     · connect-src — wss:// SKAL stå der ved siden af https://. CSP matcher
       på skema, og delingen mellem rejsemakkere kører over en websocket
       (sync.js, kanalen 'arytmi-deling'). Uden den linje holder delingen
       op med at virke, og fejlen ser ud som et netværksproblem.

     · https://arytmi.com og 'wasm-unsafe-eval' (KN 5/10: "fint med, at
       sikkerhedspolitikken åbner"). Editorens billedupload slører
       nummerplader med en motor, der hentes fra bagrummet på arytmi.com
       (redaktoer-plader.js): scriptet og dets .mjs i script-src, modellen
       og .wasm-filen i connect-src, og 'wasm-unsafe-eval' for at måtte
       oversætte WebAssembly. Det er IKKE 'unsafe-eval' — almindelig eval()
       er stadig spærret. Kun admins henter motoren, men politikken gælder
       alle; åbningen er arytmi.com, som vi selv udgiver.

     · manifest-src og worker-src (K22, 6/10) — Arytmi på hjemmeskærmen.
       Manifestet (navn, ikon, fuld skærm) og service workeren (sw.js) er
       begge vores egne filer. Uden de to linjer blokerer default-src 'none'
       dem LYDLØST: siden virker, men den kan ikke lægges på hjemmeskærmen
       og starter ikke uden net.

     · frame-ancestors er IKKE med — den ignoreres i et <meta> og virker
       kun som en ægte HTTP-header. Den ville bare give en advarsel i
       konsollen, og en konsol med støj i koster tid næste gang noget
       går galt. Appen kører i en webview på https://localhost og kan
       ikke indrammes alligevel.

     ⚠️ PRØV DEN PÅ EN RIGTIG TELEFON, ikke kun på 8641. Capacitor lægger
     sin egen bro ind i webviewen, og en CSP, der er for stram, slår den
     ihjel — lydløst, med en app der bare står tom. Byg med `npm run apk`
     og se, at kortet tegner, at en adresse kan søges, og at delingen
     stadig kommer igennem. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://arytmi.com;
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: https://vxleyvtumbwtkejoiaev.supabase.co https://*.tile.openstreetmap.org;
  font-src 'self';
  manifest-src 'self';
  worker-src 'self';
  connect-src https://vxleyvtumbwtkejoiaev.supabase.co wss://vxleyvtumbwtkejoiaev.supabase.co https://adressevaelger.dk https://arytmi.com;
  base-uri 'none';
  form-action 'none';
  object-src 'none'">
